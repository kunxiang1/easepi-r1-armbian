name: build-easepi-r1

# 手动触发（可选项见 Actions 页面），或每周五 18:00 UTC 自动跟版构建
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "内核分支  current=6.18 / edge=7.3"
        type: choice
        options: [current, edge]
        default: current
      release:
        description: "发行版"
        type: choice
        options: [trixie, bookworm, noble]
        default: trixie
      variant:
        description: "镜像类型"
        type: choice
        options: [server, minimal, desktop]
        default: server
      dts:
        description: "dts 版本  mainline=主线 / legacy=旧镜像那份(含风扇音频)"
        type: choice
        options: [mainline, legacy]
        default: mainline
      armbian_ref:
        description: "armbian/build 的 git ref（留空 = main）"
        type: string
        default: main
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: write   # 发布 Release / 建 tag 需要写权限（之前是 read，所以只出了 artifact，没进 Releases）

concurrency:
  group: build-${{ github.event.inputs.branch || 'current' }}-${{ github.event.inputs.variant || 'server' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH: ${{ github.event.inputs.branch || 'current' }}
      RELEASE: ${{ github.event.inputs.release || 'trixie' }}
      VARIANT: ${{ github.event.inputs.variant || 'server' }}
      DTS: ${{ github.event.inputs.dts || 'mainline' }}
      ARMB_REF: ${{ github.event.inputs.armbian_ref || 'main' }}
      ARMB_DIR: ${{ github.workspace }}/.armbian-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 交叉架构构建（amd64 主机编 arm64）必须能在容器里 exec arm64 二进制。
      # GitHub 托管 runner 默认没有注册 qemu binfmt，armbian 在容器内 `update-binfmts --enable`
      # 写不进去（/proc/sys/fs/binfmt_misc 只读），随后 `arch-test arm64` 失败：
      #   "arm64: not supported on this machine/kernel" → Error 1 at qemu-static.sh:129
      # 用官方 action 在**宿主机内核**上注册（带 F 标志，容器内也生效）。
      - name: QEMU binfmt (arm64 交叉构建)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Verify qemu binfmt
        run: |
          set -euo pipefail
          ls /proc/sys/fs/binfmt_misc/ || true
          docker run --rm --platform linux/arm64 alpine:latest uname -m

      - name: Disk before build
        run: df -h /

      - name: Fetch armbian/build
        run: |
          set -euo pipefail
          mkdir -p "$ARMB_DIR"
          cd "$ARMB_DIR"
          git init -q
          git remote add origin https://github.com/armbian/build.git
          git fetch --depth 1 origin "$ARMB_REF"
          git checkout -q FETCH_HEAD
          echo "armbian/build @ $(git rev-parse --short HEAD) ($(git log -1 --format=%s))"

      - name: Apply EasePi R1 board support
        run: |
          chmod +x scripts/apply.sh
          ./scripts/apply.sh "$ARMB_DIR" --branch="$BRANCH" --dts="$DTS"

      - name: Show injected files
        run: |
          set -euo pipefail
          cd "$ARMB_DIR"
          git status --short
          echo "--- dts 位置 ---"
          ls -l patch/kernel/archive/rockchip64-*/dt/rk3568-easepi-r1.dts 2>/dev/null || echo "(内核自带，无补丁)"

      - name: Restore build cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.ARMB_DIR }}/output/cache
          key: armbian-cache-${{ env.BRANCH }}-${{ github.run_id }}
          restore-keys: |
            armbian-cache-${{ env.BRANCH }}-

      - name: Build image
        working-directory: ${{ env.ARMB_DIR }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            server)  MIN=no;  DESK=no  ;;
            minimal) MIN=yes; DESK=no  ;;
            desktop) MIN=no;  DESK=yes ;;
          esac
          echo ">>> BOARD=easepi-r1 BRANCH=$BRANCH RELEASE=$RELEASE MINIMAL=$MIN DESKTOP=$DESK DTS=$DTS"
          # 注意：这里不能写 `compile.sh docker ...`。
          # armbian-next 在非 root 用户下检测到 docker 可用时会自己把命令改成 docker 再重启进容器；
          # 显式传 docker 会让容器内的重启命令仍是 docker，触发
          # "asking for docker... inside docker" 直接退出 43。
          ./compile.sh \
            BOARD=easepi-r1 \
            BRANCH="$BRANCH" \
            RELEASE="$RELEASE" \
            BUILD_MINIMAL="$MIN" \
            BUILD_DESKTOP="$DESK" \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,xz \
            EXPERT=yes

      - name: List images
        if: always()
        run: |
          set -euo pipefail
          cd "$ARMB_DIR"
          ls -la output/images/ 2>/dev/null || echo "no output/images"
          if ls output/images/*.img.xz >/dev/null 2>&1; then
            {
              echo "## EasePi-R1 构建产物"
              echo ""
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| BOARD | easepi-r1 |"
              echo "| BRANCH | $BRANCH |"
              echo "| RELEASE | $RELEASE |"
              echo "| VARIANT | $VARIANT |"
              echo "| DTS | $DTS |"
              echo "| armbian/build | $(git rev-parse --short HEAD) |"
              echo ""
              echo "### 文件"
              echo '```'
              ls -l output/images/*.img.xz output/images/*.sha 2>/dev/null || true
              echo '```'
              echo "### sha256"
              echo '```'
              cat output/images/*.sha 2>/dev/null || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: easepi-r1-${{ env.BRANCH }}-${{ env.RELEASE }}-${{ env.VARIANT }}-${{ env.DTS }}
          path: |
            ${{ env.ARMB_DIR }}/output/images/*.img.xz
            ${{ env.ARMB_DIR }}/output/images/*.sha
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ── 发布到 Releases ────────────────────────────────────────────────
      # 以前只有 upload-artifact，产物躺在 Actions 的 artifact 里（要登录才能下、30 天过期），
      # Releases 页面永远是空的。这里补上真正的发布步骤：打 tag、建 Release、上传 img.xz + sha。
      - name: Stamp release tag
        id: stamp
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          TAG="easepi-r1-${RELEASE}-${VARIANT}-${BRANCH}-${DATE}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "本次 Release tag: $TAG"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stamp.outputs.tag }}
          name: EasePi-R1 ${{ env.RELEASE }} ${{ env.VARIANT }} (${{ env.BRANCH }}, ${{ steps.stamp.outputs.date }})
          # 同一天重复构建（换 dts / 追上游）时覆盖同名资产，而不是报 422 失败
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: false
          body: |
            EasePi R1（RK3568）Armbian 镜像 — 自动构建

            | 项目 | 值 |
            |---|---|
            | 板型 | easepi-r1 (RK3568) |
            | 发行版 | ${{ env.RELEASE }} |
            | 镜像类型 | ${{ env.VARIANT }} |
            | 内核分支 | `${{ env.BRANCH }}` |
            | dts | ${{ env.DTS }} |
            | armbian/build | `${{ env.ARMB_REF }}` |
            | 构建运行 | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            **烧写**：解压后用 BalenaEtcher / Rufus 写入 SD 卡或 eMMC，或
            `xz -dc *.img.xz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync`

            默认账号 `root` / `1234`（首次登录强制改密），校验见同目录 `*.sha`。
          files: |
            ${{ env.ARMB_DIR }}/output/images/*.img.xz
            ${{ env.ARMB_DIR }}/output/images/*.sha

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: ${{ env.ARMB_DIR }}/output/logs/
          if-no-files-found: ignore
          retention-days: 7
