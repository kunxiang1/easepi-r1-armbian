# Rockchip RK3568 quad core 2-4GB SoC 2x1GbE 2x2.5GbE NVMe eMMC USB3 HDMI
# LinkEase EasePi R1 —— 板级配置
#
# 参照上游 config/boards/easepi-a2.conf（同厂 RK3568，已在官方支持列表）
# 依据：Armbian-unofficial_25.11.0-trunk_Easepi-r1_trixie_current_6.12.52_minimal.img
#       内 /etc/armbian-release + dtb compatible = "linkease,easepi-r1","rockchip,rk3568"
BOARD_NAME="EasePi-R1"
BOARD_VENDOR="linkease"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="kunxiang1"
INTRODUCED="2026"
BOOTCONFIG="easepi-r1-rk3568_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3568-easepi-r1.dtb"
BOOT_SCENARIO="spl-blobs"
IMAGE_PARTITION_TABLE="gpt"
BOOTFS_TYPE="fat"

# ==================== u-boot ====================
# u-boot 上游自 v2026.10 起自带 easepi-r1-rk3568_defconfig
# （DEFAULT_DEVICE_TREE="rockchip/rk3568-easepi-r1"，dts 由 dts/upstream 同步 Linux）。
# 25.11 那版旧镜像是 radxa-e25-rk3568_defconfig + radxa u-boot 分支，这里换成官方 defconfig。
function post_family_config__easepi_r1_use_mainline_uboot() {
	display_alert "$BOARD" "Using mainline U-Boot (${BOOTCONFIG})" "info"

	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot"
	declare -g BOOTBRANCH="tag:v2026.10"
	declare -g BOOTPATCHDIR="v2026.10"
	declare -g BOOTDIR="u-boot-${BOARD}"
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}
}
